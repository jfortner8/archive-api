services:
  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  dynamodb-local:
    image: amazon/dynamodb-local
    # In-memory, not persisted to a volume: the amazon/dynamodb-local image
    # runs as a non-root user that can't write to a Docker Desktop named
    # volume on Windows, which silently breaks every request. Local dev
    # data doesn't need to survive a restart anyway.
    command: -jar DynamoDBLocal.jar -sharedDb -inMemory
    ports:
      - "8000:8000"

  # One-off helper for `make dev-setup`; not left running.
  awscli:
    image: amazon/aws-cli
    profiles: ["tools"]
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      - minio
      - dynamodb-local

volumes:
  minio-data:
