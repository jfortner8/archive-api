name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The store tests run against a real DynamoDB rather than a fake. Without
    # this service they would skip - quietly leaving the storage layer, which
    # is where a mistake silently writes wrong data rather than erroring,
    # entirely uncovered.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000

    env:
      DYNAMODB_ENDPOINT: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000; then exit 0; fi
            sleep 1
          done
          echo "DynamoDB Local never came up" >&2
          exit 1

      - run: go vet ./...
      - run: go test ./... -v
      - run: go build ./...

      # openapi.yaml is the source the wire types are generated from. If
      # regenerating changes anything, the spec and the code disagree - which
      # is how a spec quietly becomes a lie about the API the frontend is
      # written against.
      - name: Check the generated types match the spec
        run: |
          make generate
          if ! git diff --exit-code -- internal/httpapi/gen; then
            echo "::error::openapi.yaml and the generated types disagree. Run 'make generate' and commit the result." >&2
            exit 1
          fi

  # Renders openapi.yaml as a browsable page and attaches it to the run, so a
  # reviewer or the frontend can read the API a pull request describes without
  # cloning anything.
  #
  # An artifact rather than a committed docs/api.html on purpose: the page is
  # generated from the spec, so a checked-in copy is a second thing to keep in
  # step with the first and goes stale the first time someone forgets. This one
  # is rebuilt from the spec on every run, so it cannot disagree with it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render the API reference
        run: make docs

      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/api.html
          if-no-files-found: error
          retention-days: 30

  # Puts the page the docs job just built on the public docs site, so the
  # hosted reference always matches the spec that was merged.
  #
  # Only on pushes to main: a pull request must never be able to overwrite the
  # live page, and the AWS role trusts main alone. Skipped until the three
  # repository variables exist (set them from `terraform output` after the
  # apply), so merging this ahead of the infrastructure leaves main green
  # instead of failing on an empty role ARN.
  publish-docs:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DOCS_ROLE_ARN != ''
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-reference
          path: docs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DOCS_ROLE_ARN }}
          aws-region: us-east-1

      # The page is served as index.html so the bare address works. A short
      # cache lifetime plus an invalidation means a merge shows up in minutes
      # rather than whenever an edge location next expires it.
      - name: Publish
        run: |
          aws s3 cp docs/api.html "s3://${{ vars.AWS_DOCS_BUCKET }}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "max-age=300"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DOCS_DISTRIBUTION_ID }}" \
            --paths "/" "/index.html"

  # Shows what a change would do to real infrastructure, on the pull request,
  # before it is merged.
  #
  # This exists because of a specific failure: merging the /v1 rework
  # auto-deployed code that needed a table and IAM policy which did not exist
  # yet, and nothing anywhere said so. Production returned 500 on every route
  # that touched data until someone went looking. A plan on that pull request
  # would have printed "will create aws_dynamodb_table.archive, will update
  # aws_iam_role_policy" and the ordering would have been obvious.
  #
  # It runs on every pull request rather than only on ones touching infra/,
  # which makes it a drift detector as well: if someone changes something by
  # hand in the console, the next pull request's plan says so.
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      # Required to request the OIDC token AWS trusts. This is what replaces a
      # long-lived access key.
      id-token: write
      contents: read
      # To post the plan as a comment.
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Check formatting
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Plan
        id: plan
        working-directory: infra/terraform
        # The API key is read from the function it is already set on, rather
        # than stored as a second copy in GitHub secrets. Without it the plan
        # would report a spurious change to the Lambda's environment on every
        # run and nobody would read the output for long.
        #
        # -lock=false keeps this a pure read: a plan mutates nothing, and
        # taking the state lock would need write access to the state bucket.
        run: |
          export TF_VAR_api_key="$(aws lambda get-function-configuration \
            --function-name archive-api \
            --query 'Environment.Variables.API_KEY' --output text)"
          terraform plan -input=false -lock=false -no-color > plan.txt 2>&1 || {
            echo "exit=failed" >> "$GITHUB_OUTPUT"
            tail -40 plan.txt
            exit 1
          }
          # Trim to the summary and the resource actions; a full plan can run
          # to hundreds of lines and GitHub truncates long comments.
          {
            echo "summary<<PLANEOF"
            grep -E "^(Plan:|No changes|  # )" plan.txt | head -40
            echo "PLANEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '<!-- terraform-plan -->',
              '### Terraform plan',
              '',
              '```',
              `${{ steps.plan.outputs.summary }}`.trim() || 'No changes.',
              '```',
              '',
              '_Read this before merging: infrastructure is applied by hand, so a plan showing additions means someone has to run `terraform apply` before the code that needs them reaches production._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Update the existing comment rather than adding one per push.
            const existing = comments.find(c => c.body.includes('<!-- terraform-plan -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Applies the infrastructure on every merge to main, so no one runs
  # `terraform apply` by hand. The plan job above is what a reviewer reads
  # beforehand; this is the same plan, executed.
  #
  # It runs before deploy on purpose. The failure that motivated all of this
  # was code shipping ahead of the table and permissions it needed, and
  # production returning 500s until someone noticed. Infrastructure first, code
  # second.
  #
  # Skips until AWS_APPLY_ROLE_ARN exists. That role is created by the one
  # manual apply that bootstraps it, since CI cannot create the role that
  # grants it the right to apply.
  apply:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    # Two applies at once would fight over the state lock; queue them instead.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Plan
        working-directory: infra/terraform
        # Same trick as the plan job: the API key is read from the function it
        # is already set on, so it never lives in GitHub secrets. Masked first,
        # so a stray log line cannot print it.
        run: |
          KEY="$(aws lambda get-function-configuration \
            --function-name archive-api \
            --query 'Environment.Variables.API_KEY' --output text)"
          echo "::add-mask::$KEY"
          export TF_VAR_api_key="$KEY"
          terraform plan -input=false -no-color -out=tfplan

      # An unattended apply must not be able to delete anything. A destroy or a
      # replacement (which is a destroy followed by a create) is almost always a
      # mistake in a merged change, and the stateful resources here - the table
      # and the media bucket - are the ones that cannot be recovered. If a
      # change really does need one, apply it by hand.
      - name: Refuse to destroy anything
        working-directory: infra/terraform
        run: |
          if terraform show -json tfplan | jq -e '[.resource_changes[]? | select(.change.actions | index("delete"))] | length > 0' > /dev/null; then
            echo "::error::This plan deletes or replaces resources. Not applying automatically; review it and apply by hand."
            terraform show -no-color tfplan | grep -E "^  # |must be replaced|will be destroyed"
            exit 1
          fi

      - name: Apply
        working-directory: infra/terraform
        run: terraform apply -input=false tfplan

  # Deploys to the real Lambda function on every push to main (i.e. every
  # merged PR), using credentials for archive-api-ci-deploy - an IAM user
  # scoped to only updating this one function's code, nothing else.
  #
  # Waits for apply when there is one, but a skipped apply (the role not
  # bootstrapped yet) does not block it.
  deploy:
    needs: [test, apply]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.apply.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build Lambda packages
        run: |
          GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/lambda && zip lambda.zip bootstrap
          GOOS=linux GOARCH=arm64 go build -o bootstrap ./cmd/derive && zip derive.zip bootstrap

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name archive-api \
            --zip-file fileb://lambda.zip
          aws lambda wait function-updated --function-name archive-api

          # The derivative function shares this module, so it has to move
          # with the API rather than drift behind it.
          aws lambda update-function-code \
            --function-name archive-api-derive \
            --zip-file fileb://derive.zip
          aws lambda wait function-updated --function-name archive-api-derive
